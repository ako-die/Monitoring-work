<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#35106b">
  <title>MONITORING WORK</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-splash">
    <img src="splash-1080x1920.png" alt="Monitoring Work">
    <button id="start-app" aria-label="Mulai aplikasi"></button>
</div>
</div>
  <div class="app">
    <header class="topbar">
      <div class="menu">☰</div>
      <div>
        <div class="brand">MONITORING WORK</div>
        <div class="subtitle">Monitoring Kegiatan Harian</div>
      </div>
      <div class="more">⋮</div>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button data-page="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-page="monitoring" class="nav-item"><span>☷</span><small>Monitoring</small></button>
      <button data-page="settings" class="nav-item"><span>⚙</span><small>Pengaturan</small></button>
    </nav>
  </div>
<style>
#app-splash {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #35106b;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  opacity: 1;
  visibility: visible;
  transition: opacity 0.6s ease;
}

#app-splash img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#start-app {
    position: absolute;
    left: 10%;
    bottom: 13%;
    width: 80%;
    height: 13%;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    z-index: 100000;
}
#app-splash.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
</style>

<script>
document.getElementById("start-app").addEventListener("click", function () {
    const splash = document.getElementById("app-splash");

    if (splash) {
        splash.classList.add("hide");
    }
});
</script>
  <script src="app.js"></script>
</body>
</html>
